name: Gerar APK do Baixador

on:
  push:
    branches: [ main, master ]
    paths: [ 'baixador/**', '.github/workflows/gerar-baixador.yml' ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: baixador
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renomear
        run: cp baixador/app/build/outputs/apk/debug/app-debug.apk Baixador.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Baixador-APK
          path: Baixador.apk
