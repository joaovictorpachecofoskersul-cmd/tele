name: Gerar APK do Editor

on:
  push:
    branches: [ main, master ]
    paths: [ 'editor/**', '.github/workflows/gerar-editor.yml' ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Baixar bibliotecas do editor
        run: bash editor/preparar.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: editor/android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renomear
        run: cp editor/android/app/build/outputs/apk/debug/app-debug.apk EditorDeVideo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Editor-de-Video-APK
          path: EditorDeVideo.apk
