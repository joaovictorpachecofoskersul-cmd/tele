name: Gerar APK do Editor

on:
  push:
    branches: [ main, master ]
    paths: [ 'editor/**', '.github/workflows/gerar-editor.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Baixar bibliotecas do editor
        run: bash editor/preparar.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: editor/android
        env:
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renomear
        run: cp editor/android/app/build/outputs/apk/debug/app-debug.apk Editai.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Editor-de-Video-APK
          path: Editai.apk

      - name: Publicar na página de downloads (Releases)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view editor-ultimo >/dev/null 2>&1 || gh release create editor-ultimo --title "Editaí (última versão)" --notes "APK do Editaí. Baixe o arquivo Editai.apk e instale no celular."
          gh release edit editor-ultimo --title "Editaí (última versão)" --notes "APK do Editaí. Baixe o arquivo Editai.apk e instale no celular." || true
          gh release delete-asset editor-ultimo EditorDeVideo.apk -y || true
          gh release upload editor-ultimo Editai.apk --clobber
