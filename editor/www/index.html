<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0B0B0E">
<title>Editor de Vídeo</title>
<style>
:root{--bg:#0B0B0E;--panel:#16161B;--panel2:#1F1F26;--line:rgba(255,255,255,.1);--fg:#F4F4F5;--muted:#A1A1AA;--acc:#FFE600;--red:#FF3B30;--blue:#3B82F6;
  --tlh:178px;--toolh:68px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Poppins,system-ui,-apple-system,Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{opacity:.35}
[hidden]{display:none!important}

/* ---------- início ---------- */
#home{position:fixed;inset:0;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px 40px}
#home h1{font-size:26px;margin:4px 0 2px;font-weight:900;letter-spacing:-.5px}
#home .sub{color:var(--muted);font-size:14px;margin:0 0 18px}
#newp{width:100%;padding:18px;border-radius:16px;background:var(--acc);color:#000;font-weight:800;font-size:17px;margin-bottom:22px}
#plist{display:grid;gap:10px}
.pcard{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:14px;padding:10px;cursor:pointer}
.pth{width:54px;height:96px;border-radius:8px;background:#26262e center/cover;flex:none}
.pinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.pinfo b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinfo span{font-size:12px;color:var(--muted)}
.pact{display:flex;gap:4px}
.empty{color:var(--muted);text-align:center;padding:30px 10px;line-height:1.5}
#storage{color:#71717A;font-size:12px;text-align:center;margin-top:20px}

/* ---------- editor ---------- */
#editor{position:fixed;inset:0;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top,0px) + 6px) 8px 6px;flex:none}
#top .ib{width:40px;height:40px;border-radius:10px;font-size:19px;display:grid;place-items:center}
#top .ib:active{background:var(--panel2)}
#pname{flex:1;min-width:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;padding:6px}
#exp{background:var(--acc);color:#000;font-weight:800;padding:9px 16px;border-radius:10px;font-size:14px}
#stage{flex:1;min-height:0;position:relative;display:grid;place-items:center;background:#000;overflow:hidden}
#stage canvas{display:block;background:#111;touch-action:none}
#selbox{position:absolute;border:2px solid var(--acc);border-radius:6px;pointer-events:none;box-shadow:0 0 0 1px rgba(0,0,0,.5)}
#bgtask{position:absolute;left:8px;top:8px;font-size:11px;color:var(--muted);background:rgba(0,0,0,.5);padding:2px 8px;border-radius:9px}
#bgtask:empty{display:none}
#bar{display:flex;align-items:center;gap:8px;padding:6px 10px;flex:none;background:var(--bg)}
#clock{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:1}
#play{width:44px;height:36px;border-radius:10px;background:var(--panel2);font-size:15px}
#bar .zb{width:34px;height:34px;border-radius:9px;background:var(--panel);font-size:16px}
#tlwrap{position:relative;height:var(--tlh);flex:none;background:#0F0F13;border-top:1px solid var(--line)}
#tl{position:absolute;inset:0;overflow-x:auto;overflow-y:auto;scrollbar-width:none}
#tl::-webkit-scrollbar{display:none}
#ph{position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:#fff;pointer-events:none;z-index:5;box-shadow:0 0 4px rgba(0,0,0,.8)}
.tl-in{position:relative;min-height:100%;padding-bottom:8px}
.tl-ruler{position:relative;height:20px}
.tk{position:absolute;top:0;height:6px;border-left:1px solid #3f3f46;font-size:9px;color:#71717A;padding-left:3px;white-space:nowrap}
.tk.mj{height:10px;border-color:#71717A}
.tl-row{position:relative;margin-top:4px}
.tl-row.clips{height:58px}
.clip{position:absolute;top:0;height:58px;border-radius:7px;overflow:hidden;background:#27272a;border:2px solid transparent}
.clip img{position:absolute;top:0;height:100%;object-fit:cover;pointer-events:none}
.clip.sel{border-color:#fff;z-index:2}
.clip .cb{position:absolute;left:4px;bottom:3px;font-size:10px;background:rgba(0,0,0,.65);padding:1px 5px;border-radius:5px;font-weight:700}
.hd{position:absolute;top:0;bottom:0;width:18px;background:#fff;z-index:3;touch-action:none;display:grid;place-items:center}
.hd::after{content:"";width:3px;height:40%;background:#111;border-radius:2px}
.hd.l{left:0;border-radius:5px 0 0 5px}.hd.r{right:0;border-radius:0 5px 5px 0}
.trb{position:absolute;top:16px;width:26px;height:26px;border-radius:6px;background:#fff;color:#000;font-size:14px;font-weight:900;z-index:4;box-shadow:0 1px 4px rgba(0,0,0,.6)}
.trb.on{background:var(--acc)}
.trb.sel{outline:2px solid var(--blue)}
.tl-add{position:absolute;top:12px;width:34px;height:34px;border-radius:9px;background:#fff;color:#000;font-size:22px;font-weight:700}
.tl-row.caps{height:20px}
.tl-row.caps.off{opacity:.35}
.cap{position:absolute;height:20px;border-radius:5px;background:#CA8A04;color:#000;font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;padding:2px 5px;border:1px solid rgba(0,0,0,.4)}
.cap.sel{outline:2px solid #fff}
.tl-row.lane{height:24px}
.blk{position:absolute;height:24px;border-radius:6px;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;padding:4px 7px;border:1px solid rgba(0,0,0,.4)}
.blk span{pointer-events:none}
.blk.sel{outline:2px solid #fff;z-index:2;padding:4px 22px}
.blk .hd{width:16px}
.tl-row.audio{height:24px}
.aud{position:absolute;height:24px;border-radius:6px;font-size:11px;font-weight:600;padding:4px 8px;white-space:nowrap;overflow:hidden}
.aud.music{background:#166534}.aud.beat{background:#7C2D12}
.sfx{position:absolute;height:22px;font-size:10px;font-weight:700;background:#15803D;border-radius:5px;padding:3px 6px;white-space:nowrap}
.sfx.sel{outline:2px solid #fff}
#tools{display:flex;gap:2px;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));flex:none;background:var(--panel);height:calc(var(--toolh) + env(safe-area-inset-bottom,0px));scrollbar-width:none}
#tools::-webkit-scrollbar{display:none}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:64px;padding:4px 6px;border-radius:10px;font-size:11px;color:#E4E4E7;flex:none}
.tool .ti-i{font-size:20px;line-height:1}
.tool:active{background:var(--panel2)}
.tool.danger{color:#FCA5A5}

/* ---------- folha de edição ---------- */
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:52vh;background:var(--panel);border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .24s ease;z-index:20;display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.5);max-width:720px;margin:0 auto}
#sheet.open{transform:none}
body.sheet-open #tools{visibility:hidden}
#sheet-h{display:flex;align-items:center;gap:8px;padding:10px 12px 6px;flex:none}
#sheet-t{flex:1;font-weight:800;font-size:16px}
#sheet-x,#sheet-back{background:var(--acc);color:#000;font-weight:800;padding:7px 14px;border-radius:9px;font-size:14px}
#sheet-back{background:var(--panel2);color:var(--fg)}
#sheet-b{overflow:auto;padding:4px 14px calc(18px + env(safe-area-inset-bottom,0px));flex:1}
.sec{margin:12px 0}
.sec-t{font-size:12px;color:var(--muted);font-weight:600;margin:10px 0 6px}
.hint{font-size:12px;color:var(--muted);line-height:1.45;margin:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chips.tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-bottom:8px}
.chip{padding:8px 12px;border-radius:99px;background:var(--panel2);font-size:13px;white-space:nowrap}
.chip.on{background:var(--acc);color:#000;font-weight:700}
.sl{display:block;margin:10px 0}
.sl-l{display:flex;justify-content:space-between;font-size:13px;margin-bottom:2px}
.sv{color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--acc);height:28px}
.sw-row{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.25)}
.sw.on{outline:3px solid var(--acc);outline-offset:1px}
.sw.none{background:var(--panel2);font-size:14px;color:var(--muted)}
.sw-pick{width:34px;height:32px;border:0;background:none;padding:0}
.tg{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.tg input{width:22px;height:22px;accent-color:var(--acc)}
.btn{padding:10px 14px;border-radius:10px;background:var(--panel2);font-size:14px;font-weight:600;margin:4px 6px 4px 0}
.btn.pri{background:var(--acc);color:#000;font-weight:800}
.btn.danger{color:#FCA5A5}
.btn.sm{padding:6px 10px;font-size:13px;margin:0}
.btn.big{width:100%;padding:15px;font-size:16px;margin-top:10px}
.brow{display:flex;flex-wrap:wrap;gap:0;margin:6px 0}
.ti{width:100%;background:#0E0E12;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;font:15px/1.4 Poppins,system-ui,sans-serif}
textarea.ti{resize:vertical;min-height:52px}
.nrow{display:flex;gap:8px}
.nrow>*{flex:1}
.nl{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:7px}
.gi{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:12px;background:var(--panel2);font-size:12px;text-align:center;line-height:1.2;min-height:70px;justify-content:center}
.gi.on{background:var(--acc);color:#000;font-weight:700}
.gi-i{font-size:20px}
.fxrow{background:var(--panel2);border-radius:12px;padding:8px 10px;margin:6px 0}
.list .lrow,.lrow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.lrow span{flex:1;font-size:14px}
.callout{background:#1E293B;border-radius:12px;padding:10px 12px;margin:6px 0 10px}
.callout p{margin:0 0 6px;font-size:13px;line-height:1.45}
.emojis{display:flex;flex-wrap:wrap;gap:4px}
.emojis button{font-size:26px;width:44px;height:44px;border-radius:10px;background:var(--panel2)}
.capedit .cerow{padding:8px 0;border-bottom:1px solid var(--line)}
.cetop{display:flex;gap:8px;align-items:center}
.cw{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.wchip{font-size:12px;padding:4px 8px;border-radius:7px;background:var(--panel2)}
.wchip.strong{background:#DC2626;color:#fff;font-weight:700}

/* ---------- modais ---------- */
#busy,#result,.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:12px;text-align:center}
#busy-t{font-weight:800;font-size:18px}
#busy-d{font-size:13px;color:#D4D4D8;max-width:420px;line-height:1.45;min-height:1.4em}
#busy-p{width:min(320px,80vw);height:8px;border-radius:9px;background:#27272a;overflow:hidden}
#busy-p div{height:100%;width:0;background:var(--acc);transition:width .2s}
#busy-p.ind div{width:35%!important;animation:ind 1.1s infinite ease-in-out}
@keyframes ind{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
#result video{max-width:100%;max-height:58vh;border-radius:12px;background:#000}
#result-info{font-size:12px;color:var(--muted)}
.mbox{background:var(--panel);border-radius:16px;padding:18px;max-width:380px;width:100%}
.mbox p{margin:0 0 12px;line-height:1.45}
.mrow{display:flex;justify-content:flex-end;gap:6px;margin-top:12px}
#toast{position:fixed;left:50%;bottom:calc(var(--toolh) + 20px);transform:translateX(-50%);background:rgba(39,39,42,.97);padding:10px 16px;border-radius:12px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center;line-height:1.4}
#toast.show{opacity:1}
.fatal{color:#fca5a5;padding:20px;white-space:pre-wrap}
@media (min-height:820px){:root{--tlh:200px}}
</style>
</head>
<body>

<section id="home">
  <h1>Editor de Vídeo</h1>
  <p class="sub">Corte, legenda automática, transições, efeitos e elementos. Tudo no celular.</p>
  <button id="newp" type="button">＋ Novo projeto</button>
  <div id="plist"></div>
  <div id="storage"></div>
</section>

<section id="editor" hidden>
  <div id="top">
    <button class="ib" id="back" type="button" aria-label="Voltar">←</button>
    <button id="pname" type="button"></button>
    <button class="ib" id="undo" type="button" aria-label="Desfazer">↶</button>
    <button class="ib" id="redo" type="button" aria-label="Refazer">↷</button>
    <button id="exp" type="button">Exportar</button>
  </div>
  <div id="stage"><canvas width="540" height="960"></canvas><div id="selbox" hidden></div><div id="bgtask"></div></div>
  <div id="bar">
    <span id="clock">0:00.0 / 0:00.0</span>
    <button class="zb" id="zout" type="button" aria-label="Diminuir zoom da linha do tempo">−</button>
    <button id="play" type="button" aria-label="Reproduzir">▶</button>
    <button class="zb" id="zin" type="button" aria-label="Aumentar zoom da linha do tempo">+</button>
  </div>
  <div id="tlwrap"><div id="tl"></div><div id="ph"></div></div>
  <div id="tools"></div>
</section>

<div id="sheet" role="dialog">
  <div id="sheet-h"><button id="sheet-back" type="button" hidden>← Voltar</button><span id="sheet-t"></span><button id="sheet-x" type="button">OK</button></div>
  <div id="sheet-b"></div>
</div>

<div id="busy" hidden>
  <div id="busy-t">Aguarde</div>
  <div id="busy-p"><div></div></div>
  <div id="busy-d"></div>
  <button class="btn" id="busy-x" type="button" hidden>Cancelar</button>
</div>

<div id="result" hidden>
  <video controls playsinline></video>
  <div id="result-info"></div>
  <div class="brow" style="justify-content:center">
    <button class="btn pri" id="r-save" type="button">Salvar na galeria</button>
    <button class="btn" id="r-share" type="button">Compartilhar</button>
    <button class="btn" id="r-close" type="button">Voltar a editar</button>
  </div>
</div>

<div id="toast"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
