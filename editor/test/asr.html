<!doctype html><meta charset="utf-8"><title>teste legenda</title>
<script type="module">
import { transcribe } from '/www/js/asr.js';
import { envelope } from '/www/js/audio.js';
window.run = async (model) => {
  const ab = await (await fetch('/test/fala.wav')).arrayBuffer();
  const tmp = new OfflineAudioContext(1, 16000, 16000);
  const buf = await tmp.decodeAudioData(ab);
  const mono = buf.getChannelData(0).slice();
  const env = envelope(mono, 16000, 0.02);
  const t0 = performance.now(); const stages = []; let dl = 0;
  const words = await transcribe(mono, env, { model, onStage: s => stages.push(s), onDownload: (l) => { dl = l; } });
  return { secs: (performance.now() - t0) / 1000, audio: mono.length / 16000, words, stages, dlMB: dl / 1e6, isolated: self.crossOriginIsolated };
};
window.READY = true;
</script>
